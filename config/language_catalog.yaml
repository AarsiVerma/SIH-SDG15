# VANRAKSHA AI — Language Catalog
#
# Single source of truth for user-facing copy. The system NEVER presents
# inference as fact. Detection and inference layers describe what is observed;
# risk layers request human verification. Forbidden terms must never appear in
# automated copy (see docs/LANGUAGE.md).
#
# Layers:
#   detection   -> what a model observed (never "poacher detected")
#   inference   -> a synthesized observation (e.g. restricted-zone activity)
#   risk        -> risk assessment, always requests verification when HIGH/CRITICAL
#   verification-> human-confirmed fact

forbidden_terms:
  - poacher
  - poaching
  - criminal
  - guilty
  - smuggler
  - terrorist

disclaimers:
  evidence: "Timestamped evidence supporting investigation, subject to applicable procedures."
  wildlife: "Unusual movement detected; ranger verification recommended."
  ai_outputs: "AI outputs require human verification."

messages:
  person_detected:
    title: "Person detected"
    body: "A person was observed in the camera view."
    layer: detection
  vehicle_detected:
    title: "Vehicle detected"
    body: "A vehicle was observed in the camera view."
    layer: detection
  animal_detected:
