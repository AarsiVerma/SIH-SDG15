[project]
name = "vanraksha"
version = "0.1.0"
description = "VANRAKSHA AI — forest command centre for detection, correlation, risk and incident management."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "geoalchemy2>=0.14,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "onnxruntime>=1.17,<2",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<5",
    "orjson>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
    "geo: requires a PostGIS database",
]

[project.scripts]
vanraksha-migrate = "alembic.config:main"
vanraksha-retention = "scripts.retention:main"
vanraksha-worker = "app.worker:main"
vanraksha-download-models = "scripts.download_models:main"

[tool.ruff]
line-length = 100